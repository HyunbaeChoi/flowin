<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>개플 · FLOWin</title>
<style>
  :root{
    --bg-0:#161029; --bg-1:#1f1840; --bg-2:#2a2154;
    --card:#2a2154cc; --card-border:#4a3f80;
    --ink:#f2eeff; --ink-soft:#c7bfe8; --ink-dim:#a89fd0;
    --accent:#9b8cff; --accent-soft:#6a5ce0; --accent-warm:#ffb488;
    --ok:#5fc2b0; --warn:#e08a4f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-0);color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  body{min-height:100vh;display:flex;justify-content:center;
    background:radial-gradient(circle at 50% -10%, var(--bg-2), var(--bg-0) 60%);}
  #app{width:100%;max-width:480px;min-height:100vh;padding:0 0 28px;display:flex;flex-direction:column;}

  header{padding:22px 20px 10px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-size:22px;font-weight:800;letter-spacing:-0.02em;}
  .brand span{color:var(--accent);font-style:italic;}
  .brand-sub{font-size:12.5px;color:var(--ink-dim);margin-top:2px;}
  #connectBtn{
    display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--card-border);
    color:var(--ink);border-radius:999px;padding:9px 15px;font-size:12.5px;font-weight:700;
  }
  #connectBtn .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-dim);transition:background .3s;}
  #connectBtn.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok);}

  /* ---- 호흡 오브 (실제 들숨/날숨 페이서) ---- */
  .hero{position:relative;margin:10px auto 4px;width:230px;height:230px;display:flex;align-items:center;justify-content:center;}
  .orb-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--card-border);}
  .orb{
    position:absolute;inset:14px;border-radius:50%;
    --state-color:var(--accent-soft);
    background: radial-gradient(circle at 35% 30%,
      color-mix(in srgb, var(--state-color) 45%, white) 0%,
      var(--state-color) 60%,
      color-mix(in srgb, var(--state-color) 75%, black) 100%);
    box-shadow: 0 0 50px color-mix(in srgb, var(--state-color) 45%, transparent);
    transform:scale(var(--breath-scale, 0.8));
    transition:background 1.1s ease, box-shadow 1.1s ease;
  }
  .hero-center{position:relative;z-index:2;text-align:center;}
  #bpmVal{font-size:40px;font-weight:800;line-height:1;}
  #bpmVal.dim{color:var(--ink-dim);}
  .hero-center .unit{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  #breathBig{margin-top:8px;font-size:16px;font-weight:800;color:#fff;}
  #breathSmall{font-size:12.5px;color:rgba(255,255,255,0.85);}
  .protocol-status{text-align:center;font-size:12.5px;color:var(--ink-dim);margin-top:6px;}

  /* ---- 실시간 라인차트 ---- */
  .chart-block{padding:16px 20px 0;}
  .chart-title{font-size:12.5px;color:var(--ink-soft);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;}
  .chart-title b{color:var(--ink-soft);}
  canvas{width:100%;display:block;border-radius:12px;background:#1c1638;border:1px solid var(--card-border);}
  #chartRecent{height:130px;}
  #chartFull{height:46px;margin-top:8px;}
  .legend-row{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 20px 0;font-size:12px;color:var(--ink-soft);}
  .legend-item{display:flex;align-items:center;gap:5px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;}

  /* ---- 지표 카드 ---- */
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px 4px;}
  .metric-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:12px 8px;text-align:center;}
  .metric-card .v{font-size:19px;font-weight:800;}
  .metric-card .l{font-size:11.5px;color:var(--ink-dim);margin-top:3px;}

  .section-title{font-size:13.5px;color:var(--ink-soft);font-weight:700;padding:18px 20px 8px;letter-spacing:0.02em;}
  .mood-row{display:flex;gap:8px;padding:0 20px;}
  .mood-btn{flex:1;padding:12px 0;border-radius:12px;border:1px solid var(--card-border);
    background:var(--card);color:var(--ink-soft);font-size:13px;font-weight:700;}
  .mood-btn.active{background:var(--accent-soft);color:#fff;border-color:var(--accent-warm);}

  .control-row{display:flex;gap:8px;padding:14px 20px 0;}
  .ctrl-btn{flex:1;padding:15px 0;border-radius:14px;border:none;font-size:14px;font-weight:800;
    background:#3a3160;color:var(--ink-soft);transition:background .25s,color .25s,transform .12s ease,filter .12s ease;}
  #btnStart{background:linear-gradient(135deg,var(--accent),var(--accent-soft));}
  .ctrl-btn.is-current{background:linear-gradient(135deg,var(--accent),var(--accent-warm));color:#fff;}
  #btnIntensityTouch{background:#3a3160;color:var(--ink-soft);}
  .ctrl-sub{padding:8px 20px 0;font-size:12.5px;color:var(--ink-dim);text-align:center;}

  .stim-badge{margin:14px 20px 0;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--card-border);font-size:13.5px;color:var(--ink-soft);}
  .stim-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-dim);}
  .stim-badge.on .dot{background:var(--warn);box-shadow:0 0 8px var(--warn);}

  details{margin:22px 20px 0;}
  summary{font-size:11px;color:var(--ink-dim);cursor:pointer;list-style:none;padding:8px 0;border-top:1px solid var(--card-border);}
  summary::-webkit-details-marker{display:none;}
  summary:before{content:'▸ ';}
  details[open] summary:before{content:'▾ ';}
  .debug-grid{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px;}
  .debug-btn{padding:8px 12px;border-radius:9px;border:1px solid var(--card-border);background:transparent;color:var(--ink-dim);font-size:11px;}

  /* ---- 버튼 눌림 하이라이트 ---- */
  .ctrl-btn, .mood-btn, #connectBtn, .debug-btn{
    transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
  }
  .ctrl-btn:active, .mood-btn:active, #connectBtn:active, .debug-btn:active{
    transform:scale(0.95); filter:brightness(1.25);
  }
  #btnStart:active{ box-shadow:0 0 0 4px rgba(155,140,255,0.35); }
  .mood-btn.active{ box-shadow:0 0 0 3px rgba(155,140,255,0.25); }

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:#000000cc;color:#fff;padding:10px 18px;border-radius:999px;font-size:12.5px;
    opacity:0;transition:opacity .3s, transform .3s;pointer-events:none;z-index:50;max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">

  <header>
    <div>
      <div class="brand">FLOW<span>in</span> 개플</div>
      <div class="brand-sub">실시간 HRV 모니터</div>
    </div>
    <button id="connectBtn"><span class="dot"></span><span id="connectLabel">기기 연결</span></button>
  </header>

  <div class="section-title" style="padding-top:14px;">지금 기분이 어떠세요?</div>
  <div class="mood-row">
    <button class="mood-btn" id="moodNeg">좋지않음</button>
    <button class="mood-btn active" id="moodNeu">보통</button>
    <button class="mood-btn" id="moodPos">좋음</button>
  </div>

  <div class="section-title">나이 (세)</div>
  <div class="mood-row" style="align-items:center;">
    <button class="mood-btn" id="ageMinus" style="flex:0 0 52px;font-size:18px;">−</button>
    <input type="number" id="ageInput" value="18" min="3" max="99"
      style="flex:1;text-align:center;font-size:18px;font-weight:800;background:var(--card);
      border:1px solid var(--card-border);border-radius:12px;color:var(--ink);padding:12px 0;">
    <button class="mood-btn" id="agePlus" style="flex:0 0 52px;font-size:18px;">+</button>
  </div>
  <div class="ctrl-sub" id="ageOffsetLabel">현재 나이 기준 오프셋: +0 BPM (성인 기준)</div>

  <div class="hero">
    <div class="orb-ring"></div>
    <div class="orb" id="breathOrb"></div>
    <div class="hero-center">
      <div id="bpmVal" class="dim">--</div>
      <div class="unit">BPM</div>
      <div id="breathBig">대기 중</div>
      <div id="breathSmall">기기를 연결하고 시작해보세요</div>
    </div>
  </div>
  <div class="protocol-status" id="protocolStatus">현재 프로토콜: 대기 · 들숨 5초 · 날숨 5초</div>
  <div id="calibrationStatus" style="display:none;text-align:center;font-size:12.5px;color:var(--accent-warm);margin-top:4px;font-weight:700;"></div>

  <div class="chart-block">
    <div class="chart-title"><span>최근 1분 흐름</span><b id="lapLabel">0:00 / 1:00</b></div>
    <canvas id="chartRecent"></canvas>
    <div class="chart-title" style="margin-top:2px;"><span>전체 세션 (5분)</span><b id="sessLabel">0:00 / 5:00</b></div>
    <canvas id="chartFull"></canvas>
  </div>
  <div class="legend-row" id="legend"></div>

  <div class="metrics">
    <div class="metric-card"><div class="v" id="mRmssd">--</div><div class="l">RMSSD</div></div>
    <div class="metric-card"><div class="v" id="mSdnn">--</div><div class="l">SDNN</div></div>
    <div class="metric-card"><div class="v" id="mG30">--</div><div class="l">G30</div></div>
  </div>

  <div class="control-row" style="padding-top:20px;">
    <button class="ctrl-btn is-current" id="btnStart">START</button>
    <button class="ctrl-btn" id="btnStop">STOP</button>
  </div>
  <div class="control-row">
    <button class="ctrl-btn" id="btnIntensityTouch">강도 <span id="lvVal">1</span> · 다음단계</button>
  </div>
  <div class="ctrl-sub">타겟: <span id="targetVal">RELAX</span> · 좋지않음 → 이완/안정, 보통·좋음 → 낮엔 몰입 지향, 밤엔 이완 지향</div>

  <div class="stim-badge" id="stimBadge"><span class="dot"></span><span id="stimText">자극 대기 중</span></div>

  <details>
    <summary>개발자 디버그 도구</summary>
    <div class="debug-grid">
      <button class="debug-btn" id="btnSimOn">시뮬레이터 ON/OFF</button>
      <button class="debug-btn" id="btnFingerOff">센서 이탈 시뮬레이션</button>
    </div>
  </details>

</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 상태 정의 (그래프/범례/호흡 전부 이 순서 하나로 통일) ================= */
const STATE_ORDER = ['무기력','이완','안정','몰입','스트레스','불안'];
const STATE_COLOR_HEX = { '무기력':'#e0607a','이완':'#5fc2b0','안정':'#8b5cf6','몰입':'#5cc36a','스트레스':'#e0b84f','불안':'#e08a4f' };
const BREATH_MAP = {
  '무기력':{inhale:6,exhale:4}, '이완':{inhale:4,exhale:5}, '안정':{inhale:5,exhale:5},
  '몰입':{inhale:5,exhale:5}, '스트레스':{inhale:4,exhale:6}, '불안':{inhale:4,exhale:7}, '측정중':{inhale:5,exhale:5}
};
function stateToY(s){ const i=STATE_ORDER.indexOf(s); return i<0?50:(i/(STATE_ORDER.length-1))*100; }

// ================= 연속 바이오피드백 점수 + 라벨 (하나의 계산에서 함께 산출) =================
// 위치(그래프 높이)와 라벨(색/글자)이 서로 다른 공식으로 계산되면 경계 근처에서 어긋날 수 있어,
// classifyEmotion6과 동일한 우선순위 구조를 그대로 따르되 각 구간 안에서 연속값을 계산한다.
// 고정된 정규화 범위 대신, 이번 세션에서 실제 관찰된 최소~최대값에 맞춰 자동으로 스케일을
// 조정한다. 사람마다 HRV 절대 수준이 크게 다르므로(예: 평소 HRV가 높은 사람 vs 낮은 사람),
// 고정 범위로는 특정 사용자에게 항상 천장/바닥에 붙어버리는 문제가 생긴다.
function clamp01(v){ return Math.max(0, Math.min(1, v)); }
let hrvRange=null; // {rmssd:{min,max}, sdnn:{min,max}, g30:{min,max}}
function updateHrvRange(rmssd,sdnn,g30){
  if(!hrvRange){ hrvRange={rmssd:{min:rmssd,max:rmssd},sdnn:{min:sdnn,max:sdnn},g30:{min:g30,max:g30}}; return; }
  hrvRange.rmssd.min=Math.min(hrvRange.rmssd.min,rmssd); hrvRange.rmssd.max=Math.max(hrvRange.rmssd.max,rmssd);
  hrvRange.sdnn.min=Math.min(hrvRange.sdnn.min,sdnn); hrvRange.sdnn.max=Math.max(hrvRange.sdnn.max,sdnn);
  hrvRange.g30.min=Math.min(hrvRange.g30.min,g30); hrvRange.g30.max=Math.max(hrvRange.g30.max,g30);
}
function adaptiveNorm(val, stat){
  if(!stat) return 0.5;
  const range=stat.max-stat.min;
  if(range<1e-6) return 0.5; // 아직 변동이 없으면 중간값
  return clamp01((val-stat.min)/range);
}

function bandFromScore(score){
  if(score<10) return '무기력';
  if(score<30) return '이완';
  if(score<50) return '안정';
  if(score<70) return '몰입';
  if(score<90) return '스트레스';
  return '불안';
}
function bioScoreAndLabel(bpmV, rmssd, sdnn, g30, mood, age, target, anchor){
  if(bpmV<=0||rmssd<=0||sdnn<=0) return {score:null,label:'측정중',hrvNorm:null};
  const bOff=bpmOffsetFromAge(age||18), sOff=sdnnOffsetFromAge(age||18), rOff=rmssdOffsetFromAge(age||18);
  const highArousal=bpmV>=75+bOff, lowArousal=bpmV<55+bOff;
  const highHRV=(rmssd>=45-rOff&&sdnn>=30-sOff), midHRV=(rmssd>=25-rOff&&sdnn>=18-sOff);

  // HRV 코히런스 정도(0~1): 이번 세션의 실측 범위 대비 상대적 위치
  const hrvNorm = clamp01(
      adaptiveNorm(rmssd, hrvRange&&hrvRange.rmssd)*0.55 +
      adaptiveNorm(sdnn, hrvRange&&hrvRange.sdnn)*0.30 +
      adaptiveNorm(g30, hrvRange&&hrvRange.g30)*0.15
  );
  // 감정을 선택한 시점의 RMSSD/SDNN/G30 '원본 값' 대비, 실제로 얼마나 좋아졌는지로만
  // 전환한다. 적응형(세션 상대) 정규화값을 기준으로 쓰면 세션 중 관찰범위가 넓어지면서
  // 실제 개선 없이도 값이 흔들릴 수 있어, 반드시 원본 ms/%p 단위 절대 차이로 계산한다.
  // 문턱을 넉넉히 잡아서, 정상적인 박동 노이즈(몇 ms 흔들림)만으로는 넘지 못하게 한다.
  const a = anchor || {rmssd, sdnn, g30};
  const improvement = clamp01(
      clamp01((rmssd-a.rmssd)/35)*0.55 +
      clamp01((sdnn-a.sdnn)/25)*0.30 +
      clamp01((g30-a.g30)/30)*0.15
  );

  let score, label;
  if(highArousal && !midHRV){
    score = 80 + (1-hrvNorm)*20;
    label = (mood==='neg') ? '불안' : '스트레스';
  } else if(lowArousal && !midHRV){
    score = (1-hrvNorm)*10;
    label = '무기력';
  } else if(highHRV){
    if(bpmV>=60+bOff && bpmV<=78+bOff && g30>=25){
      if(mood==='neg'){
        // 감정 선택 시점 대비 HRV가 실제로 좋아진 만큼만 스트레스→안정으로 옮겨간다.
        // '몰입'까지는 여전히 막는다 — 자기 보고가 나쁜데 몰입이라 하는 건
        // 너무 강한 긍정 주장이라서다.
        const calmScore = 30 + hrvNorm*20;
        const stressAnchor = 70 + (1-hrvNorm)*20;
        score = stressAnchor*(1-improvement) + calmScore*improvement;
        label = bandFromScore(score);
      }
      else if(target==='FLOW'){
        // 몸 신호가 좋아도, 실제로 20Hz 공진 자극(FLOW 타겟)이 걸려있을 때만 몰입으로 인정한다.
        // 뇌파를 직접 측정하진 못하지만, 20Hz 자극이 뇌-미주신경 공진을 유도하는 조건이라는
        // 전제 하에, 그 조건이 실제로 걸려있는지를 몰입 판정의 게이트로 삼는다.
        score=50+hrvNorm*20; label='몰입';
      } else {
        // 같은 몸 신호라도 타겟이 RELAX(8Hz)면 20Hz 공진 조건이 아니므로 안정으로 본다.
        score=30+hrvNorm*20; label='안정';
      }
    } else {
      // 몰입 조건은 아니지만 HRV는 이미 충분히 높은 경우.
      // 감정을 '좋지않음'으로 선택했다면, 그 시점 대비 HRV가 실제로 좋아진 만큼만
      // 무기력/스트레스에서 이완 쪽으로 옮겨간다. 시간이 그냥 지나서가 아니라
      // 수치가 실제로 움직여야만 바뀐다 — 가만히 있는데 저절로 좋아지면 안 된다.
      const relaxScore = 10 + hrvNorm*20;
      if(mood==='neg'){
        const moodAnchorScore = (bpmV<60+bOff) ? (1-hrvNorm)*10 : 70+(1-hrvNorm)*20;
        score = moodAnchorScore*(1-improvement) + relaxScore*improvement;
      } else {
        score = relaxScore;
      }
      label = bandFromScore(score);
    }
  } else if(midHRV){
    score = 30 + hrvNorm*20;
    label = '안정';
  } else {
    // 애매한 구간: 몸 신호 우선, 스트레스로
    score = 70 + (1-hrvNorm)*20;
    label = '스트레스';
  }
  return {score:clamp01(score/100)*100, label, hrvNorm};
}

const legendEl=document.getElementById('legend');
STATE_ORDER.forEach(s=>{
  const div=document.createElement('div'); div.className='legend-item';
  div.innerHTML=`<span class="legend-dot" style="background:${STATE_COLOR_HEX[s]}"></span>${s}`;
  legendEl.appendChild(div);
});

let bleDevice=null, bleServer=null, bleTxChar=null, bleRxChar=null;
let selectedMood='neu';
let currentAge=18;
let lastMood=null, moodSetAt=Date.now(), moodAnchor=null;
let moodAnchorBuf=[]; // 첫 5초 표본을 모아 평균 낸 뒤 기준점으로 확정 (첫 샘플 하나만 보면 그 자체가 노이즈일 수 있음)
let lastAcceptedBpm=68;
const rawBuffer=[]; const SMOOTH_WINDOW_SEC=2, MOTION_ARTIFACT_MAX_DELTA_BPM=12;

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm=setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ================= 분류 로직 (나이 오프셋 반영) ================= */
function bpmOffsetFromAge(age){
  if(age>=18) return 0;
  if(age<=8) return 25;
  return Math.round(25*(18-age)/(18-8));
}
// SDNN은 소아~청소년기 완만히 증가하는 경향(RMSSD보다 근거가 뚜렷함)이 있어
// 나이가 어릴수록 요구 기준을 살짝 낮춘다. RMSSD/G30은 4세 이후 비교적 안정적이라는
// 근거가 있어 손대지 않는다.
function sdnnOffsetFromAge(age){
  if(age<=8) return 10;
  if(age<18) return Math.round(10*(18-age)/(18-8));
  if(age<=30) return 0;
  if(age>=65) return 15;
  return Math.round(15*(age-30)/(65-30));
}
// RMSSD는 20대까지는 큰 변화가 없다가 30대 이후 완만히, 60대 이후로 뚜렷하게 낮아지는
// 경향(Framingham/Umetani 등 자율신경 노화 연구)이 있어, 30세 이후로 요구 기준을 낮춘다.
function rmssdOffsetFromAge(age){
  if(age<=30) return 0;
  if(age>=65) return 20;
  return Math.round(20*(age-30)/(65-30));
}
// 경계선에서 호흡성 심박 떨림(RSA) 때문에 라벨이 초 단위로 왔다갔다 하는 걸 막기 위해,
// 같은 새 판정이 3초(3회) 연속 나와야만 실제로 화면 상태를 전환한다.
let displayState='측정중', pendingState=null, pendingCount=0;
const STATE_STREAK_NEEDED=3;
function stabilizeState(rawState){
  if(rawState==='측정중'){ pendingState=null; pendingCount=0; displayState='측정중'; return displayState; }
  if(rawState===displayState){ pendingState=null; pendingCount=0; return displayState; }
  if(rawState===pendingState) pendingCount++;
  else { pendingState=rawState; pendingCount=1; }
  if(pendingCount>=STATE_STREAK_NEEDED){ displayState=pendingState; pendingState=null; pendingCount=0; }
  return displayState;
}

/* ================= 실시간 라인차트 (시간=x, 상태위치=y) ================= */
const SESSION_DURATION_SEC=300, LAP_SEC=60;
let history=[], sessionStartMs=null;
const canvasRecent=document.getElementById('chartRecent'), ctxRecent=canvasRecent.getContext('2d');
const canvasFull=document.getElementById('chartFull'), ctxFull=canvasFull.getContext('2d');

function fitCanvas(cv){
  const dpr=window.devicePixelRatio||1;
  const rect=cv.getBoundingClientRect();
  cv.width=rect.width*dpr; cv.height=rect.height*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {w:rect.width, h:rect.height};
}

function drawOneChart(canvas, ctx, windowStart, windowEnd, showGrid){
  const {w,h}=fitCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const leftPad = showGrid ? 44 : 0; // y축 상태 라벨용 여백 (최근 1분 그래프에만)
  const plotW = w - leftPad;
  function xOf(t){ return leftPad + Math.max(0, Math.min(plotW, ((t-windowStart)/(windowEnd-windowStart))*plotW)); }
  function yOf(v){ return h-(v/100)*h*0.82-h*0.09; }

  if(showGrid){
    // y축 상태 라벨: 각 상태의 중심 위치에 이름을 표시
    ctx.font='700 12.5px Pretendard, sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
    STATE_ORDER.forEach(s=>{
      const y = yOf(stateToY(s));
      ctx.fillStyle = STATE_COLOR_HEX[s];
      ctx.fillText(s, leftPad-6, y);
      ctx.strokeStyle = STATE_COLOR_HEX[s]+'22'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(leftPad, y); ctx.lineTo(w, y); ctx.stroke();
    });
  }

  const visible = history.filter(p=>p.t>=windowStart && p.t<=windowEnd);
  if(visible.length<2) return;
  ctx.lineWidth=showGrid?3:2; ctx.lineJoin='round'; ctx.lineCap='round';
  for(let i=1;i<visible.length;i++){
    const p0=visible[i-1], p1=visible[i];
    const x0=xOf(p0.t), y0=yOf(p0.y), x1=xOf(p1.t), y1=yOf(p1.y);
    const grad=ctx.createLinearGradient(x0,y0,x1,y1);
    grad.addColorStop(0, STATE_COLOR_HEX[p0.stateName]||'#8b7cf5');
    grad.addColorStop(1, STATE_COLOR_HEX[p1.stateName]||'#8b7cf5');
    ctx.strokeStyle=grad; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  }
  if(showGrid){
    const last=visible[visible.length-1];
    ctx.lineTo(xOf(last.t),h); ctx.lineTo(xOf(visible[0].t),h); ctx.closePath();
    const fillGrad=ctx.createLinearGradient(0,0,0,h);
    fillGrad.addColorStop(0,(STATE_COLOR_HEX[last.stateName]||'#8b7cf5')+'33');
    fillGrad.addColorStop(1,(STATE_COLOR_HEX[last.stateName]||'#8b7cf5')+'00');
    ctx.fillStyle=fillGrad; ctx.fill();
    ctx.beginPath(); ctx.arc(xOf(last.t),yOf(last.y),5,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle='#ffb488'; ctx.stroke();
  }
}
function fmtMMSS(sec){ sec=Math.max(0,Math.floor(sec)); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }

function drawChart(){
  const now=Date.now();
  if(sessionStartMs!==null){
    const elapsed=now-sessionStartMs;
    const currentLap=Math.floor(elapsed/(LAP_SEC*1000));
    const lapStart=sessionStartMs+currentLap*LAP_SEC*1000;
    drawOneChart(canvasRecent, ctxRecent, lapStart, lapStart+LAP_SEC*1000, true);
    drawOneChart(canvasFull, ctxFull, sessionStartMs, sessionStartMs+SESSION_DURATION_SEC*1000, false);
    document.getElementById('lapLabel').textContent = `${fmtMMSS((now-lapStart)/1000)} / 1:00`;
    document.getElementById('sessLabel').textContent = `${fmtMMSS(elapsed/1000)} / 5:00`;
    if(elapsed >= SESSION_DURATION_SEC*1000){
      history=[]; sessionStartMs=null;
      showToast('5분 세션 완료 · 새 세션을 시작합니다');
    }
  } else {
    ctxRecent.clearRect(0,0,canvasRecent.width,canvasRecent.height);
    ctxFull.clearRect(0,0,canvasFull.width,canvasFull.height);
  }
}
let chartTicking=true;
function chartLoop(){
  drawChart();
  if(chartTicking) requestAnimationFrame(chartLoop);
}
requestAnimationFrame(chartLoop);
window.addEventListener('resize', drawChart);

function pushHistoryPoint(stateName, y){
  if(stateName==='측정중' || y===null) return;
  if(sessionStartMs===null){ sessionStartMs=Date.now(); hrvRange=null; }
  const now=Date.now();
  const prev=history[history.length-1];
  // 상태가 바뀌는 순간엔 중간 지점을 하나 더 찍고, 그 구간 색은 '이전' 상태 색으로 유지한다.
  if(prev && prev.stateName!==stateName){
    history.push({ t:(prev.t+now)/2, y:(prev.y+y)/2, stateName:prev.stateName });
  }
  history.push({t:now, y, stateName});
}

/* ================= 호흡 페이서 (상태별 들숨/날숨 초 자동 반영) ================= */
let currentSmoothState='측정중', activeBreath={inhale:5,exhale:5}, breathTimer=0, signalFinding=false;
function easeInOut(p){ return p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; }
function breathLoop(ts){
  if(!breathLoop.last) breathLoop.last=ts;
  const dt=(ts-breathLoop.last)/1000; breathLoop.last=ts;
  if(!deviceActive){ requestAnimationFrame(breathLoop); return; }
  breathTimer+=dt;
  const cycle=activeBreath.inhale+activeBreath.exhale;
  let t=breathTimer%cycle;
  if(t<dt){
    activeBreath = BREATH_MAP[currentSmoothState] || BREATH_MAP['안정'];
    updateProtocolLabel(currentSmoothState);
  }
  let scale,big,small;
  if(t<activeBreath.inhale){
    scale=0.62+0.38*easeInOut(t/activeBreath.inhale); big='들이쉬세요'; small=`숨을 · ${Math.ceil(activeBreath.inhale-t)}초`;
  } else {
    scale=1.0-0.38*easeInOut((t-activeBreath.inhale)/activeBreath.exhale); big='내쉬세요'; small=`천천히 · ${Math.ceil(cycle-t)}초`;
  }
  if(signalFinding){ big='신호를 찾고 있는 중입니다'; small='호흡에 집중하세요'; }
  document.getElementById('breathOrb').style.setProperty('--breath-scale', scale.toFixed(3));
  document.getElementById('breathBig').textContent=big;
  document.getElementById('breathSmall').textContent=small;
  requestAnimationFrame(breathLoop);
}
requestAnimationFrame(breathLoop);
function updateProtocolLabel(stateName){
  const b=BREATH_MAP[stateName]||BREATH_MAP['안정'];
  const label = stateName==='측정중' ? '대기' : stateName;
  document.getElementById('protocolStatus').textContent = `현재 프로토콜: ${label} · 들숨 ${b.inhale}초 · 날숨 ${b.exhale}초`;
}

/* ================= 데이터 반영 ================= */
function updateNumbers(state, avgBpm, avgRmssd, avgSdnn, avgG30){
  const bpmEl=document.getElementById('bpmVal');
  if(state==='측정중' && avgBpm<=0){ bpmEl.textContent='--'; bpmEl.classList.add('dim'); }
  else { bpmEl.textContent=Math.round(avgBpm); bpmEl.classList.remove('dim'); }
  document.getElementById('mRmssd').textContent = avgRmssd>0? Math.round(avgRmssd) : '--';
  document.getElementById('mSdnn').textContent  = avgSdnn>0 ? Math.round(avgSdnn)  : '--';
  document.getElementById('mG30').textContent   = avgG30>0  ? Math.round(avgG30)   : '--';
}

function handleFingerPresence(fingerOn){
  if(!fingerOn){
    currentSmoothState='측정중'; updateNumbers('측정중',0,0,0,0);
    signalFinding=false;
    displayState='측정중'; pendingState=null; pendingCount=0;
  }
}

// 실제 기기 상태(ACTIVE/IDLE)에 맞춰 START/STOP 강조 색을 전환한다.
let deviceActive=false;
function setRunStateUI(isActive){
  const wasActive=deviceActive;
  deviceActive=isActive;
  document.getElementById('btnStart').classList.toggle('is-current', !isActive);
  document.getElementById('btnStop').classList.toggle('is-current', isActive);
  if(isActive && !wasActive){
    // IDLE→ACTIVE로 새로 시작하는 순간: 이전 세션의 흔적을 완전히 지운다.
    // (그래프 5분 타이머, 적응형 HRV 범위, 감정 시작 타이머 전부 새로 시작)
    history=[]; sessionStartMs=null; hrvRange=null;
    lastMood=null; moodSetAt=Date.now(); moodAnchor=null; moodAnchorBuf=[];
    displayState='측정중'; pendingState=null; pendingCount=0;
  }
  if(!isActive){
    document.getElementById('calibrationStatus').style.display='none';
    currentSmoothState='측정중';
    breathTimer=0;
    signalFinding=false;
    document.getElementById('breathOrb').style.setProperty('--breath-scale','0.8');
    document.getElementById('breathOrb').style.setProperty('--state-color','#6a5ce0');
    document.getElementById('breathBig').textContent='대기 중';
    document.getElementById('breathSmall').textContent='START를 누르면 호흡이 시작됩니다';
    document.getElementById('protocolStatus').textContent='현재 프로토콜: 대기 · 정지됨';
  }
}

function ingestSample(raw){
  handleFingerPresence(raw.fingerOn !== false);
  if(raw.deviceState){ setRunStateUI(raw.deviceState==='ACTIVE'); }
  if(raw.fingerOn === false){
    // ACTIVE인데 아직 손가락 신호 자체가 안 잡힌 구간도 "찾는 중"으로 안내
    signalFinding = deviceActive;
    return;
  }
  lastAcceptedBpm = raw.bpm;

  rawBuffer.push({...raw, ts:Date.now()});
  const cutoff=Date.now()-SMOOTH_WINDOW_SEC*1000;
  while(rawBuffer.length && rawBuffer[0].ts<cutoff) rawBuffer.shift();
  const n=rawBuffer.length;
  const avgBpm=rawBuffer.reduce((s,v)=>s+v.bpm,0)/n;
  const avgRmssd=rawBuffer.reduce((s,v)=>s+v.rmssd,0)/n;
  const avgSdnn=rawBuffer.reduce((s,v)=>s+v.sdnn,0)/n;
  const avgG30=rawBuffer.reduce((s,v)=>s+v.g30,0)/n;
  if(raw.mood !== lastMood){ lastMood=raw.mood; moodSetAt=Date.now(); moodAnchor=null; moodAnchorBuf=[]; }
  updateHrvRange(avgRmssd, avgSdnn, avgG30);
  const bio=bioScoreAndLabel(avgBpm, avgRmssd, avgSdnn, avgG30, raw.mood, currentAge, raw.target, moodAnchor);
  if(moodAnchor===null){
    const elapsedSec=(Date.now()-moodSetAt)/1000;
    // HRV 계산이 15개 박동 평균이라 처음 15초 정도는 값 자체가 워밍업 중이라 불안정하다.
    // 이 구간을 기준점으로 잡으면 몸이 아무 변화가 없어도 "개선"으로 착각한다.
    // 워밍업이 끝난 15~20초 구간의 평균을 기준점으로 삼는다.
    const calEl=document.getElementById('calibrationStatus');
    calEl.style.display='block';
    calEl.textContent = `기준값 측정 중 · ${Math.max(0,Math.ceil(20-elapsedSec))}초 남음`;
    if(elapsedSec>=15 && elapsedSec<20){
      moodAnchorBuf.push({rmssd:avgRmssd, sdnn:avgSdnn, g30:avgG30});
    }
    if(elapsedSec>=20){
      if(moodAnchorBuf.length>0){
        const n=moodAnchorBuf.length;
        moodAnchor={
          rmssd: moodAnchorBuf.reduce((s,p)=>s+p.rmssd,0)/n,
          sdnn:  moodAnchorBuf.reduce((s,p)=>s+p.sdnn,0)/n,
          g30:   moodAnchorBuf.reduce((s,p)=>s+p.g30,0)/n
        };
      } else {
        moodAnchor={rmssd:avgRmssd, sdnn:avgSdnn, g30:avgG30}; // 안전장치
      }
      document.getElementById('calibrationStatus').style.display='none';
    }
  }
  const rawState=bio.label;
  const state=stabilizeState(rawState);

  // 손가락은 붙었는데 아직 심박 신호를 못 잡은 구간(보통 수초~수십초): 호흡 오브 문구로 안내
  signalFinding = (deviceActive && avgBpm<=0);

  updateNumbers(state, avgBpm, avgRmssd, avgSdnn, avgG30);
  pushHistoryPoint(rawState, bio.score);
  if(state!=='측정중'){
    currentSmoothState=state;
    document.getElementById('breathOrb').style.setProperty('--state-color', STATE_COLOR_HEX[state]||'#6a5ce0');
  }

  if(raw.stimOn !== undefined){
    const badge=document.getElementById('stimBadge');
    badge.classList.toggle('on', !!raw.stimOn);
    document.getElementById('stimText').textContent = raw.stimOn ? '자극 진행 중' : '자극 대기 중';
  }
  if(raw.stimLevel){ document.getElementById('lvVal').textContent = raw.stimLevel; }
  if(raw.target){ document.getElementById('targetVal').textContent = raw.target; }
}

/* ================= 감정 선택 ================= */
function setMoodUI(mood){
  selectedMood=mood;
  document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('active'));
  ({neg:'moodNeg',neu:'moodNeu',pos:'moodPos'})[mood] &&
    document.getElementById(({neg:'moodNeg',neu:'moodNeu',pos:'moodPos'})[mood]).classList.add('active');
}
document.getElementById('moodNeg').onclick=()=>{ setMoodUI('neg'); bleSendMood('neg'); };
document.getElementById('moodNeu').onclick=()=>{ setMoodUI('neu'); bleSendMood('neu'); };
document.getElementById('moodPos').onclick=()=>{ setMoodUI('pos'); bleSendMood('pos'); };

/* ================= 나이 입력 (연속값) ================= */
function bpmOffsetFromAge(age){
  if(age>=18) return 0;
  if(age<=8) return 25;
  return Math.round(25*(18-age)/(18-8));
}
function updateAgeOffsetLabel(age){
  const bOff=bpmOffsetFromAge(age), sOff=sdnnOffsetFromAge(age), rOff=rmssdOffsetFromAge(age);
  document.getElementById('ageOffsetLabel').textContent =
    (bOff>0||sOff>0||rOff>0)
      ? `현재 나이 기준: BPM +${bOff}, SDNN -${sOff}, RMSSD -${rOff} (${age}세)`
      : `현재 나이 기준 오프셋 없음 (18~30세 기준)`;
}
const ageInputEl=document.getElementById('ageInput');
function commitAge(){
  let v=parseInt(ageInputEl.value,10);
  if(isNaN(v)) v=18;
  v=Math.max(3,Math.min(99,v));
  ageInputEl.value=v;
  currentAge=v;
  updateAgeOffsetLabel(v);
  bleWrite('AGE:'+v);
}
document.getElementById('ageMinus').onclick=()=>{ ageInputEl.value=Math.max(3,(parseInt(ageInputEl.value,10)||18)-1); commitAge(); };
document.getElementById('agePlus').onclick =()=>{ ageInputEl.value=Math.min(99,(parseInt(ageInputEl.value,10)||18)+1); commitAge(); };
ageInputEl.addEventListener('change', commitAge);
updateAgeOffsetLabel(18);

/* ================= BLE ================= */
const BLE_SERVICE_UUID='12345678-1234-5678-1234-56789abcdef0';
const BLE_TX_UUID='12345678-1234-5678-1234-56789abcdef1';
const BLE_RX_UUID='12345678-1234-5678-1234-56789abcdef2';

async function bleConnect(){
  if(!navigator.bluetooth){
    alert('이 브라우저는 Web Bluetooth를 지원하지 않습니다.\n안드로이드 Chrome에서 열어주세요.');
    return;
  }
  try{
    bleDevice = await navigator.bluetooth.requestDevice({ filters:[{ services:[BLE_SERVICE_UUID] }] });
    bleDevice.addEventListener('gattserverdisconnected', ()=>{ setConnectUI(false); showToast('기기 연결이 끊어졌어요'); });
    bleServer = await bleDevice.gatt.connect();
    const service = await bleServer.getPrimaryService(BLE_SERVICE_UUID);
    bleTxChar = await service.getCharacteristic(BLE_TX_UUID);
    bleRxChar = await service.getCharacteristic(BLE_RX_UUID);
    await bleTxChar.startNotifications();
    bleTxChar.addEventListener('characteristicvaluechanged', onBleTelemetry);
    setConnectUI(true);
    showToast('개플 기기 연결됨');
    bleWrite('HOUR:'+new Date().getHours());
    setInterval(()=>{ if(bleRxChar) bleWrite('HOUR:'+new Date().getHours()); }, 5*60*1000);
  }catch(err){ console.error(err); alert('BLE 연결 실패: '+err.message); }
}
function setConnectUI(on){
  document.getElementById('connectBtn').classList.toggle('on', on);
  document.getElementById('connectLabel').textContent = on ? '연결됨' : '기기 연결';
}
function onBleTelemetry(evt){
  const text=new TextDecoder('utf-8').decode(evt.target.value);
  let d; try{ d=JSON.parse(text); }catch(e){ return; }
  ingestSample({
    bpm:d.bpm, rmssd:d.rmssd, sdnn:d.sdnn, g30:d.g30,
    mood: d.mood==='NEG'?'neg': d.mood==='POS'?'pos':'neu',
    fingerOn:d.fingerOn, stimOn:d.stimOn, stimLevel:d.stimLevel, target:d.target, deviceState:d.state
  });
  if(typeof d.age==='number' && document.activeElement!==ageInputEl){
    ageInputEl.value=d.age; currentAge=d.age; updateAgeOffsetLabel(d.age);
  }
}
async function bleWrite(text){
  if(!bleRxChar){ showToast('먼저 기기를 연결해주세요'); return; }
  try{
    await bleRxChar.writeValue(new TextEncoder().encode(text));
    showToast('전송됨: '+text);
  }catch(err){
    console.error('BLE write 실패', err);
    showToast('전송 실패: '+err.message);
  }
}
function bleSendMood(mood){ bleWrite('MOOD:' + (mood==='neg'?'NEG': mood==='pos'?'POS':'NEU')); }

document.getElementById('connectBtn').onclick = bleConnect;
document.getElementById('btnStart').onclick = ()=> bleWrite('CMD:START');
document.getElementById('btnStop').onclick  = ()=> bleWrite('CMD:STOP');
document.getElementById('btnIntensityTouch').onclick = ()=> bleWrite('CMD:INTENSITY');

/* ================= 디버그 시뮬레이터 ================= */
let simTimer=null;
document.getElementById('btnSimOn').onclick=()=>{
  if(simTimer){ clearInterval(simTimer); simTimer=null; showToast('시뮬레이터 정지'); return; }
  showToast('시뮬레이터 시작');
  simTimer=setInterval(()=>{
    ingestSample({ bpm:60+Math.random()*25, rmssd:20+Math.random()*40, sdnn:15+Math.random()*30,
      g30:Math.random()*40, mood:selectedMood, fingerOn:true, stimOn:Math.random()>0.5, stimLevel:1, target:'RELAX' });
  },1000);
};
document.getElementById('btnFingerOff').onclick=()=> ingestSample({bpm:0,rmssd:0,sdnn:0,g30:0,mood:selectedMood,fingerOn:false});
</script>
